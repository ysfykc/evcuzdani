<!DOCTYPE html>
<html data-theme="light" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="#f7f5f0" name="theme-color"/>
<title>Ev Cüzdanı</title>

<link rel="manifest" href="manifest-ev.json">
<link rel="icon" type="image/png" href="ev-logo.png">
<link rel="apple-touch-icon" href="ev-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#f7f5f0; --bg2:#edeae3; --bg3:#e3e0d8;
  --surf:#fff; --brd:rgba(0,0,0,.08); --brd2:rgba(0,0,0,.14);
  --txt:#1a1814; --txt2:#706d66; --txt3:#a8a49c;
  --prim:#ff6b6b; --prim-bg:#ffebeb; --prim2:#fa5252;
  --sec:#20c997; --sec-bg:#e6fcf5;
  --r:16px; --nav:68px; --top:64px;
  --fd:'DM Sans',sans-serif; --fs:'Instrument Serif',serif;
  --ios-blur:rgba(255,255,255,.78);
  --ios-card:rgba(255,255,255,.86);
  --ios-shadow:0 12px 32px rgba(15,23,42,.08);
}
[data-theme=dark] {
  --bg:#100f0d; --bg2:#1a1815; --bg3:#242118;
  --surf:#1e1c18; --brd:rgba(255,255,255,.06); --brd2:rgba(255,255,255,.12);
  --txt:#f0ece4; --txt2:#9a9690; --txt3:#5a5852;
  --prim:#ff6b6b; --prim-bg:#3b1a1a;
  --sec:#20c997; --sec-bg:#0a291f;
  --ios-blur:rgba(30,28,24,.78);
  --ios-card:rgba(30,28,24,.88);
  --ios-shadow:0 12px 32px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fd);background:var(--bg);color:var(--txt);min-height:100dvh;overflow-x:hidden}
button,input{font-family:var(--fd);border:none;background:none;outline:none}

/* LOGIN */
#login {
  position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #1f1111 0%, #0a0505 100%); padding: 0 32px;
}
.login-bg { width: 100%; max-width: 320px; height: auto; object-fit: contain; margin-bottom: 24px; border-radius: 36px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
.box { width: 100%; text-align: center; }
.fam-code { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 16px; color: #fff; text-align: center; font-size: 16px; margin-bottom: 16px; font-weight: 600; letter-spacing: 1px;}
.fam-code::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; letter-spacing: normal;}
.login-btn { width: 100%; padding: 14px; border-radius: 14px; background: #fff; color: #000; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

/* TOPBAR & NAV */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--ios-blur);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--brd2);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200}
.logo{font-family:var(--fs);font-size:22px;display:flex;align-items:center;gap:8px}
.logo-img{width:32px;height:32px;border-radius:8px;box-shadow:var(--ios-shadow)}
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--ios-blur);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:.5px solid var(--brd2);display:flex;padding:0 8px 12px;z-index:200}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--txt3);transition:.2s}
.nbtn.on{color:var(--prim)}
.nbtn span{font-size:22px}

/* MAIN */
main{padding-top:calc(var(--top) + 16px);padding-bottom:calc(var(--nav) + 20px)}
.page{display:none; padding:0 16px;}
.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* KARTLAR */
.card{background:var(--ios-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:20px;box-shadow:var(--ios-shadow);margin-bottom:16px}
.c-ttl{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;justify-content:space-between}
.budget-val{font-family:var(--fs);font-size:42px;line-height:1;margin-bottom:8px;color:var(--txt)}
.b-bar-bg{width:100%;height:10px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.b-bar{height:100%;background:linear-gradient(90deg,var(--prim),var(--prim2));border-radius:99px;transition:width .4s}
.b-info{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--txt2)}

/* LİSTELER */
.add-box{display:flex;gap:8px;margin-bottom:16px}
.add-inp{flex:1;background:var(--bg2);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:500;color:var(--txt)}
.add-btn{width:48px;height:48px;border-radius:14px;background:var(--prim);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(255,107,107,.3)}
.add-btn:active{transform:scale(.95)}

.l-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--surf);border-radius:16px;margin-bottom:8px;box-shadow:var(--ios-shadow);border:.5px solid var(--brd)}
.l-left{display:flex;align-items:center;gap:12px;flex:1;}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--brd2);display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.chk.on{background:var(--sec);border-color:var(--sec)}
.chk.on::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.l-name{font-size:15px;font-weight:600;color:var(--txt);transition:.2s}
.l-name.done{text-decoration:line-through;color:var(--txt3)}
.l-meta{font-size:10px;color:var(--txt3);margin-top:4px;display:flex;align-items:center;gap:4px}
.l-who{background:var(--bg2);padding:2px 6px;border-radius:6px;font-weight:700}
.del{color:var(--red);font-size:18px;padding:4px 8px;flex-shrink:0}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:900;display:none;align-items:flex-end}
.ov.on{display:flex}
.mod{width:100%;background:var(--surf);border-radius:32px 32px 0 0;padding:24px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.inp-grp{margin-bottom:16px}
.inp-lbl{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:8px;display:block}
.mod-inp{width:100%;background:var(--bg2);padding:16px;border-radius:16px;font-size:16px;font-weight:600;color:var(--txt)}
.mod-btn{width:100%;padding:16px;border-radius:16px;background:var(--prim);color:#fff;font-size:16px;font-weight:700;text-align:center;margin-top:8px}

.empty{text-align:center;padding:40px 20px;color:var(--txt3);font-size:14px}
#sync{font-size:14px;background:var(--bg2);padding:4px 8px;border-radius:99px;font-weight:600}
</style>
</head>
<body>

<div id="login">
  <img src="ev-logo.png" class="login-bg">
  <div class="box">
    <input type="text" id="evKodu" class="fam-code" placeholder="Eşinizle Ortak Bir Şifre Belirleyin">
    <button id="loginBtn" class="login-btn" onclick="girisYap()">
      <svg height="20" viewbox="0 0 24 24" width="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
      Google ile Giriş Yap
    </button>
    <p style="color:rgba(255,255,255,0.6);font-size:11px;margin-top:16px;">Ortak kodunuzu giren herkes bu listeyi görebilir.<br>Lütfen tahmin edilmesi zor bir kod yazın.</p>
  </div>
</div>

<header class="topbar">
  <div class="logo"><img class="logo-img" src="ev-logo.png">Ev Cüzdanı</div>
  <div class="tbr">
    <div id="sync">⏳ Bağlanıyor</div>
    <button class="ibtn" onclick="temaDegis()">🌙</button>
    <button class="ibtn" onclick="cikisYap()" style="font-size:12px;font-weight:700">Çık</button>
  </div>
</header>

<main>
  <div class="page on" id="p1">
    <div class="add-box">
      <input type="text" id="yeniUrun" class="add-inp" placeholder="Alınacak bir şey ekle...">
      <button class="add-btn" onclick="urunEkle()">+</button>
    </div>
    <div id="listeKutusu"></div>
  </div>

  <div class="page" id="p2">
    <div class="card">
      <div class="c-ttl"><span>Aylık Kalan Bütçe</span> <span onclick="modalAc('mBakiye')" style="cursor:pointer;color:var(--prim)">Düzenle ⚙️</span></div>
      <div class="budget-val" id="bKalan">₺0</div>
      <div class="b-bar-bg"><div class="b-bar" id="bBar" style="width:0%"></div></div>
      <div class="b-info"><span id="bHarcandi">₺0 Harcandı</span><span id="bLimit">Limit: ₺0</span></div>
    </div>
    
    <div class="add-box">
      <input type="text" id="hAd" class="add-inp" style="flex:1.5" placeholder="Nereye harcandı?">
      <input type="number" id="hTutar" class="add-inp" style="flex:1" placeholder="Tutar (₺)">
      <button class="add-btn" onclick="harcamaEkle()">+</button>
    </div>
    
    <div id="harcamaKutusu"></div>
  </div>
</main>

<nav class="nav">
  <div class="nbtn on" onclick="tab(1)"><span>🛒</span>Market</div>
  <div class="nbtn" onclick="tab(2)"><span>💸</span>Bütçe</div>
</nav>

<div class="ov" id="mBakiye" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="mod">
    <div class="inp-grp">
      <label class="inp-lbl">Aylık Toplam Bütçe Limiti (₺)</label>
      <input type="number" id="yeniLimit" class="mod-inp">
    </div>
    <button class="mod-btn" onclick="limitKaydet()">Kaydet</button>
  </div>
</div>

<script>
const CFG = {
  apiKey:'AIzaSyADpIRNLQEIer_gplTgwKi_EKkfcyrYoqY',
  authDomain:'maasgunu-bd353.firebaseapp.com',
  projectId:'maasgunu-bd353'
};

let db, auth, user = null;
let evKodu = localStorage.getItem('ev_kodu') || '';
let veri = { limit: 0, liste: [], harcamalar: [] };
let unsubscribe = null;

async function initFb() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore, doc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');

  const app = initializeApp(CFG);
  db = getFirestore(app);
  auth = getAuth(app);
  window._fb = { doc, setDoc, onSnapshot, signInWithPopup, GoogleAuthProvider, signOut };

  onAuthStateChanged(auth, u => {
    user = u;
    if(u) {
      if(!evKodu) {
        document.getElementById('login').style.display = 'flex';
      } else {
        document.getElementById('login').style.display = 'none';
        canliBaglantiKur();
      }
    } else {
      document.getElementById('login').style.display = 'flex';
    }
  });
}

async function girisYap() {
  const kod = document.getElementById('evKodu').value.trim().toLowerCase();
  if(!kod) return alert("Lütfen ortak bir ev kodu girin!");
  evKodu = kod;
  localStorage.setItem('ev_kodu', kod);
  
  const { signInWithPopup, GoogleAuthProvider } = window._fb;
  document.getElementById('loginBtn').textContent = 'Bekleyin...';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { console.log(e); document.getElementById('loginBtn').textContent = 'Tekrar Dene'; }
}

async function cikisYap() {
  localStorage.removeItem('ev_kodu');
  if(unsubscribe) unsubscribe();
  await window._fb.signOut(auth);
  window.location.reload();
}

// 🟢 CANLI BAĞLANTI (EŞZAMANLI SYNC)
function canliBaglantiKur() {
  const { doc, onSnapshot } = window._fb;
  const docRef = doc(db, 'households', evKodu);
  
  document.getElementById('sync').textContent = '🟢 Senkronize';

  unsubscribe = onSnapshot(docRef, (snap) => {
    if(snap.exists()) {
      try {
        const parsed = JSON.parse(snap.data().json || '{}');
        veri = {
          limit: parsed.limit || 0,
          liste: parsed.liste || [],
          harcamalar: parsed.harcamalar || []
        };
      } catch(e) {
        veri = { limit: 0, liste: [], harcamalar: [] };
      }
    } else {
      veri = { limit: 0, liste: [], harcamalar: [] };
    }
    render();
  });
}

// Veriyi buluta tek tıkla yolla
async function veriyiGuncelle() {
  if(!user || !evKodu) return;
  const { doc, setDoc } = window._fb;
  document.getElementById('sync').textContent = '⏳ Yazılıyor';
  try {
    await setDoc(doc(db, 'households', evKodu), { json: JSON.stringify(veri) });
    document.getElementById('sync').textContent = '🟢 Senkronize';
  } catch(error) {
    console.error("Firebase İzini Yok:", error);
    document.getElementById('sync').textContent = '❌ İzin Hatası';
    alert("Firebase veritabanı ayarlarında 'Rules' (Güvenlik) izni verilmediği için kaydedilemedi! Lütfen Firebase konsolundan kuralları güncelleyin.");
  }
}

function userName() {
  if(!user) return "Anonim";
  return user.displayName ? user.displayName.split(' ')[0] : "Birisi";
}

function uid() { return Date.now().toString(36); }

/* --- İŞLEMLER --- */

function urunEkle() {
  const ad = document.getElementById('yeniUrun').value.trim();
  if(!ad) return;
  veri.liste.push({ id: uid(), ad: ad, alindi: false, ekleyen: userName() });
  document.getElementById('yeniUrun').value = '';
  render(); // Anında ekrana yansıt (Hızlı tepki)
  veriyiGuncelle();
}

function toggleAlindi(id) {
  const item = veri.liste.find(x => x.id === id);
  if(item) { 
    item.alindi = !item.alindi; 
    render();
    veriyiGuncelle(); 
  }
}

function urunSil(id) {
  veri.liste = veri.liste.filter(x => x.id !== id);
  render();
  veriyiGuncelle();
}

function harcamaEkle() {
  const ad = document.getElementById('hAd').value.trim();
  const tutar = parseFloat(document.getElementById('hTutar').value);
  if(!ad || !tutar) return;
  veri.harcamalar.push({ id: uid(), ad: ad, tutar: tutar, ekleyen: userName(), tarih: new Date().toISOString() });
  document.getElementById('hAd').value = '';
  document.getElementById('hTutar').value = '';
  render();
  veriyiGuncelle();
}

function harcamaSil(id) {
  veri.harcamalar = veri.harcamalar.filter(x => x.id !== id);
  render();
  veriyiGuncelle();
}

function modalAc(id) {
  document.getElementById(id).classList.add('on');
  document.getElementById('yeniLimit').value = veri.limit || 0;
}

function limitKaydet() {
  veri.limit = parseFloat(document.getElementById('yeniLimit').value) || 0;
  document.getElementById('mBakiye').classList.remove('on');
  render();
  veriyiGuncelle();
}

/* --- EKRAN ÇİZİMİ --- */
function render() {
  // Liste
  const lKutu = document.getElementById('listeKutusu');
  if(veri.liste.length === 0) {
    lKutu.innerHTML = '<div class="empty">Sepet boş. Evin eksiklerini buraya ekle.</div>';
  } else {
    // Alınmayanlar üstte, alınanlar altta
    const sirali = [...veri.liste].sort((a,b) => (a.alindi === b.alindi) ? 0 : a.alindi ? 1 : -1);
    lKutu.innerHTML = sirali.map(x => `
      <div class="l-item">
        <div class="l-left" onclick="toggleAlindi('${x.id}')" style="cursor:pointer">
          <div class="chk ${x.alindi ? 'on' : ''}"></div>
          <div>
            <div class="l-name ${x.alindi ? 'done' : ''}">${x.ad}</div>
            <div class="l-meta"><span class="l-who">${x.ekleyen}</span> ekledi</div>
          </div>
        </div>
        <div class="del" onclick="urunSil('${x.id}')" style="cursor:pointer">🗑</div>
      </div>
    `).join('');
  }

  // Bütçe
  const harcanan = veri.harcamalar.reduce((s, x) => s + x.tutar, 0);
  const kalan = (veri.limit || 0) - harcanan;
  const pct = veri.limit ? Math.min(100, (harcanan / veri.limit) * 100) : 0;

  document.getElementById('bKalan').textContent = `₺${kalan.toLocaleString('tr-TR')}`;
  document.getElementById('bHarcandi').textContent = `₺${harcanan.toLocaleString('tr-TR')} Harcandı`;
  document.getElementById('bLimit').textContent = `Limit: ₺${(veri.limit||0).toLocaleString('tr-TR')}`;
  document.getElementById('bBar').style.width = pct + '%';
  document.getElementById('bBar').style.background = pct > 90 ? 'var(--red)' : '';

  const hKutu = document.getElementById('harcamaKutusu');
  if(veri.harcamalar.length === 0) {
    hKutu.innerHTML = '<div class="empty">Henüz harcama eklenmedi.</div>';
  } else {
    const siraliH = [...veri.harcamalar].sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
    hKutu.innerHTML = siraliH.map(x => `
      <div class="l-item">
        <div class="l-left">
          <div class="chk on" style="border:none;background:rgba(0,0,0,.05);font-size:16px">💸</div>
          <div>
            <div class="l-name">${x.ad}</div>
            <div class="l-meta"><span class="l-who">${x.ekleyen}</span> · ${new Date(x.tarih).toLocaleDateString('tr-TR')}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-weight:700;font-size:15px">₺${x.tutar.toLocaleString('tr-TR')}</div>
          <div class="del" onclick="harcamaSil('${x.id}')" style="cursor:pointer">🗑</div>
        </div>
      </div>
    `).join('');
  }
}

function tab(n) {
  document.querySelectorAll('.page').forEach((e, i) => e.classList.toggle('on', i+1 === n));
  document.querySelectorAll('.nbtn').forEach((e, i) => e.classList.toggle('on', i+1 === n));
}

function temaDegis() {
  const d = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = d ? 'light' : 'dark';
}

document.addEventListener('DOMContentLoaded', initFb);
</script>
</body>
</html>
