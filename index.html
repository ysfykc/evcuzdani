<!DOCTYPE html>
<html data-theme="light" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="#f2f2f7" name="theme-color" id="themeColorMeta"/>
<title>Ev Cüzdanı</title>

<link rel="manifest" href="manifest-ev.json">
<link rel="icon" type="image/png" href="ev-logo.png">
<link rel="apple-touch-icon" href="ev-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f2f2f7; 
  --bg2: #e5e5ea; 
  --bg3: #d1d1d6;
  --surf: rgba(255, 255, 255, 0.85);
  --surf-solid: #ffffff;
  --brd: rgba(60, 60, 67, 0.1); 
  --brd2: rgba(60, 60, 67, 0.15);
  --txt: #1c1c1e; 
  --txt2: #3a3a3c; 
  --txt3: #8e8e93;
  --prim: #ff3b30; 
  --prim2: #ff453a; 
  --prim-bg: #ffeceb;
  --sec: #34c759; 
  --sec-bg: #eaf9ee;
  --ios-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
  --ios-shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  
  --r: 20px; --nav: 72px; --top: 60px;
  --fd: 'Inter', sans-serif; --fs: 'Instrument Serif', serif;
  --blur: blur(24px);
}
[data-theme=dark] {
  --bg: #000000; 
  --bg2: #1c1c1e; 
  --bg3: #2c2c2e;
  --surf: rgba(28, 28, 30, 0.85);
  --surf-solid: #1c1c1e;
  --brd: rgba(255, 255, 255, 0.1); 
  --brd2: rgba(255, 255, 255, 0.15);
  --txt: #f2f2f7; 
  --txt2: #ebebf5; 
  --txt3: #8e8e93;
  --prim: #ff453a; 
  --prim-bg: #3a1a1a;
  --sec: #30d158; 
  --sec-bg: #112a18;
  --ios-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --ios-shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-family:var(--fd);-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--txt);min-height:100dvh;overflow-x:hidden;transition:background .3s, color .3s;}
button,input{font-family:var(--fd);border:none;background:none;outline:none;}
input::placeholder {color: var(--txt3);}

/* GİRİŞ EKRANI */
#login { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle at top, #1c1c1e 0%, #000 100%); padding:0 32px; }
.login-bg { width:100%; max-width:280px; height:auto; object-fit:contain; margin-bottom:32px; border-radius:40px; box-shadow:0 32px 64px rgba(0,0,0,0.6); }
.fam-code { width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:18px; padding:18px; color:#fff; text-align:center; font-size:20px; margin-bottom:16px; font-weight:700; letter-spacing:3px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.fam-code::placeholder { font-size:14px; font-weight:500; letter-spacing:normal; }
.login-btn { width:100%; padding:16px; border-radius:18px; background:#fff; color:#000; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 12px 24px rgba(255,255,255,0.2); transition:.2s; }
.login-btn:active { transform:scale(0.96); }
.gen-code-area { margin-top:24px; padding-top:24px; border-top:1px solid rgba(255,255,255,0.1); width:100%; text-align:center;}
.gen-txt { color:rgba(255,255,255,0.5); font-size:12px; line-height:1.6; }
.gen-btn { margin-top:10px; color:#ff453a; font-weight:700; font-size:14px; cursor:pointer; padding:8px 16px; background:rgba(255,69,58,0.1); border-radius:99px;}

/* İMZA VE VERSİYON (LOGIN) */
.login-badge { position:absolute; top:24px; right:24px; background:rgba(0,0,0,0.4); color:rgba(255,255,255,0.85); padding:6px 12px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:0.04em; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:0.5px solid rgba(255,255,255,0.15); z-index:10; }
.login-footer-sig { position:absolute; bottom:24px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:0.5px; }
.login-footer-sig strong { color:rgba(255,255,255,0.8); font-weight:800; }

/* TOPBAR */
.topbar { position:fixed; top:0; left:0; right:0; height:var(--top); background:var(--surf); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-bottom:.5px solid var(--brd); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:200; }
.logo { font-family:var(--fs); font-size:24px; display:flex; align-items:center; gap:10px; letter-spacing:-0.5px; }
.logo-img { width:32px; height:32px; border-radius:8px; box-shadow:var(--ios-shadow-sm); }
.tbr { display:flex; align-items:center; gap:10px; }
.sync-badge { font-size:11px; background:var(--bg2); padding:5px 10px; border-radius:99px; font-weight:700; display:flex; align-items:center; gap:4px;}
.sync-dot { width:6px; height:6px; background:var(--sec); border-radius:50%; }
.ibtn { width:34px; height:34px; border-radius:50%; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--txt); cursor:pointer;}
.ibtn:active { transform:scale(0.9); }

/* AY NAVIGASYONU (15'inden 15'ine) */
.ay-nav-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; background:var(--surf-solid); padding:10px 16px; border-radius:20px; box-shadow:var(--ios-shadow-sm); border:.5px solid var(--brd); }
.ay-name { font-weight:800; font-size:13.5px; color:var(--txt); letter-spacing:-0.3px; text-transform:uppercase;}

/* MAIN & PAGES */
main { padding-top:calc(var(--top) + 20px); padding-bottom:calc(var(--nav) + 120px); }
.page { display:none; padding:0 20px; }
.page.on { display:block; animation:fade .3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes fade { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }

/* GRUPLAMA BAŞLIKLARI */
.group-lbl { font-size:13px; font-weight:700; color:var(--txt3); text-transform:uppercase; letter-spacing:1px; margin:24px 0 8px 8px; }

/* SWIPE (KAYDIRMA) */
.swipe-wrap { position:relative; margin-bottom:10px; border-radius:20px; overflow:hidden; background:var(--surf-solid); box-shadow:var(--ios-shadow-sm); border:.5px solid var(--brd); }
.swipe-bg { position:absolute; inset:0; display:flex; justify-content:space-between; align-items:center; padding:0 24px; font-weight:800; font-size:14px; z-index:0; opacity:0; transition:opacity .2s; }
.swipe-left { color:var(--sec); }
.swipe-right { color:var(--prim); }
.swipe-content { position:relative; z-index:1; background:var(--surf-solid); padding:16px; border-radius:20px; display:flex; align-items:center; justify-content:space-between; touch-action:pan-y; will-change:transform; cursor:pointer;}
.swipe-content:active { background:var(--bg2); }

/* LİSTE ÖĞELERİ */
.l-info { display:flex; align-items:center; gap:14px; flex:1; min-width:0; }
.chk { width:28px; height:28px; border-radius:50%; border:2px solid var(--brd2); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.2s; }
.chk.on { background:var(--sec); border-color:var(--sec); }
.chk.on::after { content:'✓'; color:#fff; font-size:15px; font-weight:800; }
.l-texts { display:flex; flex-direction:column; gap:2px; min-width:0; }
.l-name { font-size:16px; font-weight:600; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:.2s; }
.l-name.done { text-decoration:line-through; color:var(--txt3); }
.l-meta { font-size:11px; color:var(--txt3); display:flex; align-items:center; gap:6px; font-weight:500;}
.l-who { background:var(--bg); padding:2px 8px; border-radius:99px; font-weight:700; color:var(--txt2); }

/* BÜTÇE KARTLARI */
.card { background:var(--surf-solid); border-radius:28px; padding:24px; box-shadow:var(--ios-shadow); margin-bottom:20px; border:.5px solid var(--brd); position:relative; overflow:hidden;}
.c-ttl { font-size:12px; font-weight:800; color:var(--txt3); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.budget-val { font-family:var(--fs); font-size:48px; line-height:1; margin-bottom:12px; color:var(--txt); letter-spacing:-1px;}
.b-bar-bg { width:100%; height:12px; background:var(--bg2); border-radius:99px; overflow:hidden; margin:16px 0 8px; }
.b-bar { height:100%; background:linear-gradient(90deg, var(--prim), var(--prim2)); border-radius:99px; transition:width .5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.b-info { display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--txt2); }

/* KİM NE HARCADI */
.u-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:.5px solid var(--brd); }
.u-row:last-child { border-bottom:none; padding-bottom:0; }
.u-name { font-size:14px; font-weight:700; color:var(--txt); display:flex; align-items:center; gap:12px;}
.u-amt { font-size:15px; font-weight:800; color:var(--txt); }
.u-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg, var(--prim), var(--prim2)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; box-shadow:var(--ios-shadow-sm);}

/* SİLİNENLER BÖLÜMÜ */
.deleted-sec { margin-top:24px; background:var(--surf-solid); border:.5px dashed var(--brd); border-radius:24px; overflow:hidden; }
.deleted-head { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:12px; color:var(--txt3); cursor:pointer; text-transform:uppercase; letter-spacing:1px;}
.deleted-body { display:none; border-top:.5px solid var(--brd); padding:8px 20px 16px; }
.deleted-body.on { display:block; animation:fade .3s; }
.d-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:.5px solid var(--brd); }
.d-item:last-child { border-bottom:none; padding-bottom:0; }
.d-info { flex:1; min-width:0; }
.d-name { font-size:14px; font-weight:600; color:var(--txt2); text-decoration:line-through; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.d-meta { font-size:11px; color:var(--txt3); margin-top:4px; font-weight:500;}
.d-actions { display:flex; gap:8px; flex-shrink:0;}
.d-btn { padding:8px 12px; border-radius:12px; font-size:11px; font-weight:800; background:var(--bg2); color:var(--txt); cursor:pointer;}
.d-btn.red { color:var(--prim); }
.d-btn:active { transform:scale(0.9); }

/* SABİT ALT EKLEME ÇUBUĞU */
.fixed-add-bar { position:fixed; bottom:calc(var(--nav) + 16px); left:20px; right:20px; background:var(--surf); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); padding:8px; border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.15); display:flex; gap:8px; border:.5px solid var(--brd); z-index:150; animation:fadeUp .3s; }
.fixed-add-bar input { flex:1; background:var(--bg); border-radius:18px; padding:14px 16px; font-size:15px; font-weight:500; color:var(--txt); }
.add-btn { width:48px; height:48px; border-radius:18px; background:var(--prim); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.2s; cursor:pointer;}
.add-btn:active { transform:scale(0.9); }

/* HARCAMA EKLEME İÇİN ÖZEL ÇUBUK */
.h-inputs { display:flex; gap:8px; flex:1; }
.h-inputs input { width:50%; }

/* NAV */
.nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav); background:var(--surf); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-top:.5px solid var(--brd); display:flex; padding:0 16px 16px; z-index:200; }
.nbtn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10.5px; font-weight:800; color:var(--txt3); transition:.2s; cursor:pointer;}
.nbtn.on { color:var(--prim); }
.nbtn span { font-size:24px; transition:transform .2s;}
.nbtn.on span { transform:scale(1.1); }

/* MODAL */
.ov { position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:900; display:none; align-items:center; justify-content:center; padding:20px;}
.ov.on { display:flex; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.mod { width:100%; max-width:340px; background:var(--surf-solid); border-radius:32px; padding:24px; box-shadow:0 32px 64px rgba(0,0,0,0.3); transform:scale(0.95); transition:.2s;}
.ov.on .mod { transform:scale(1); }
.inp-lbl { font-size:12px; font-weight:800; color:var(--txt3); margin-bottom:8px; display:block; text-transform:uppercase; letter-spacing:1px;}
.mod-inp { width:100%; background:var(--bg2); padding:16px; border-radius:16px; font-size:18px; font-weight:700; color:var(--txt); text-align:center; margin-bottom:16px;}
.mod-btn { width:100%; padding:16px; border-radius:16px; background:var(--prim); color:#fff; font-size:16px; font-weight:800; cursor:pointer;}

.empty { text-align:center; padding:40px 20px; color:var(--txt3); font-size:15px; font-weight:500;}

/* TOAST */
.toast { position:fixed; top:20px; left:50%; transform:translate(-50%, -20px); background:var(--txt); color:var(--bg); padding:14px 24px; border-radius:99px; font-size:14px; font-weight:700; z-index:9999; opacity:0; pointer-events:none; box-shadow:0 16px 32px rgba(0,0,0,0.3); transition:.3s cubic-bezier(0.2, 0.8, 0.2, 1); white-space:nowrap; display:flex; align-items:center; gap:8px;}
.toast.on { opacity:1; transform:translate(-50%, 0); }

.h-amt { font-size:16px; font-weight:800; color:var(--txt); }
</style>
</head>
<body>

<div id="login">
  <div class="login-badge">v1.0</div>
  <img src="ev-logo.png" class="login-bg">
  <div class="box">
    <input type="text" id="evKodu" class="fam-code" placeholder="GÜVENLİ AİLE KODU">
    <button id="loginBtn" class="login-btn" onclick="girisYap()">
      <svg height="20" viewbox="0 0 24 24" width="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
      Google ile Giriş Yap
    </button>

      <div class="gen-txt">İlk kez mi kullanıyorsunuz? Eşinizle ortak kullanmak için eşsiz bir kod oluşturun.</div>

<header class="topbar">

<script>
const CFG = {
  apiKey:'AIzaSyADpIRNLQEIer_gplTgwKi_EKkfcyrYoqY',
  authDomain:'maasgunu-bd353.firebaseapp.com',
  projectId:'maasgunu-bd353'
};

let db, auth, user = null;
let evKodu = localStorage.getItem('ev_kodu') || '';
let veri = { aylar: {}, liste: [], silinenListe: [] };
let unsubscribe = null;
let oncekiUrunSayisi = -1; 
let aktifAy = getPeriodId(); 

function getPeriodId(dStr) {
  const d = dStr ? new Date(dStr) : new Date();
  let y = d.getFullYear();
  let m = d.getMonth() + 1;
  if (d.getDate() < 15) {
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
  }
  return `${y}-${String(m).padStart(2, '0')}`;
}

function getPeriodName(periodId) {
  const [yStr, mStr] = periodId.split('-');
  let y = parseInt(yStr), m = parseInt(mStr);
  const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  let m2 = m + 1; let y2 = y;
  if (m2 > 12) { m2 = 1; y2++; }
  return `15 ${AYLAR[m-1]} - 14 ${AYLAR[m2-1]}`;
}

async function initFb() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore, doc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');

  const app = initializeApp(CFG);
  db = getFirestore(app);
  auth = getAuth(app);
  window._fb = { doc, setDoc, onSnapshot, signInWithPopup, GoogleAuthProvider, signOut };

  onAuthStateChanged(auth, u => {
    user = u;
    if(u) {
      if(!evKodu) {
        document.getElementById('login').style.display = 'flex';
      } else {
        document.getElementById('login').style.display = 'none';
        canliBaglantiKur();
      }
    } else {
      document.getElementById('login').style.display = 'flex';
    }
  });
  
  if(localStorage.getItem('evTema')==='dark') temaDegis(true);
}

function guvenliKodOlustur() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let kod = '';
  for(let i=0; i<8; i++) {
    if(i===4) kod += '-';
    kod += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('evKodu').value = kod;
  alert("Güvenli kodunuz oluşturuldu!\n\nKod: " + kod + "\n\nKopyalayıp eşinize WhatsApp'tan göndermeyi unutmayın.");
}

async function girisYap() {
  const kod = document.getElementById('evKodu').value.trim().toUpperCase();
  if(!kod) return showToast("⚠️ Lütfen bir kod girin");
  evKodu = kod;
  localStorage.setItem('ev_kodu', kod);
  
  const { signInWithPopup, GoogleAuthProvider } = window._fb;
  document.getElementById('loginBtn').textContent = 'Bekleyin...';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { console.log(e); document.getElementById('loginBtn').innerHTML = 'Tekrar Dene'; }
}

async function cikisYap() {
  if(!confirm('Çıkış yapmak istiyor musunuz?')) return;
  localStorage.removeItem('ev_kodu');
  if(unsubscribe) unsubscribe();
  await window._fb.signOut(auth);
  window.location.reload();
}

function dataMigration(parsed) {
  let v = parsed;
  if (!v.aylar) {
    v.aylar = {};
    let mevcutLimit = v.limit || 0;
    (v.harcamalar || []).forEach(h => {
      let pId = getPeriodId(h.tarih);
      if (!v.aylar[pId]) v.aylar[pId] = { limit: mevcutLimit, harcamalar: [], silinenHarcamalar: [] };
      v.aylar[pId].harcamalar.push(h);
    });
    v.silinenListe = [];
    delete v.harcamalar;
    delete v.limit;
  }
  if (!v.liste) v.liste = [];
  if (!v.silinenListe) v.silinenListe = [];

  if (!v.aylar[aktifAy]) {
    let prevLimit = 0;
    let keys = Object.keys(v.aylar).sort();
    if(keys.length > 0) prevLimit = v.aylar[keys[keys.length-1]].limit;
    v.aylar[aktifAy] = { limit: prevLimit, harcamalar: [], silinenHarcamalar: [] };
  }
  return v;
}

function canliBaglantiKur() {
  const { doc, onSnapshot } = window._fb;
  const docRef = doc(db, 'households', evKodu);
  
  document.getElementById('syncText').textContent = 'Senkronize';
  document.querySelector('.sync-dot').style.background = 'var(--sec)';

  unsubscribe = onSnapshot(docRef, (snap) => {
    if(snap.exists()) {
      try {
        const parsed = JSON.parse(snap.data().json || '{}');
        veri = dataMigration(parsed);

        const gUrunS = veri.liste.length;
        if (oncekiUrunSayisi !== -1 && gUrunS > oncekiUrunSayisi) {
           const sUrun = veri.liste[gUrunS - 1];
           if (sUrun && sUrun.ekleyen !== userName()) {
               showToast("🛒 " + sUrun.ekleyen + " yeni ürün ekledi!");
               try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e){}
           }
        }
        oncekiUrunSayisi = gUrunS;
      } catch(e) { veri = dataMigration({}); }
    } else {
      veri = dataMigration({});
    }
    render();
  });
}

async function veriyiGuncelle() {
  if(!user || !evKodu) return;
  const { doc, setDoc } = window._fb;
  document.getElementById('syncText').textContent = 'Yazılıyor';
  document.querySelector('.sync-dot').style.background = 'var(--prim)';
  try {
    await setDoc(doc(db, 'households', evKodu), { json: JSON.stringify(veri) });
    document.getElementById('syncText').textContent = 'Senkronize';
    document.querySelector('.sync-dot').style.background = 'var(--sec)';
  } catch(error) {
    showToast('❌ İzin Hatası!');
  }
}

function userName() {
  if(!user) return "Anonim";
  return user.displayName ? user.displayName.split(' ')[0] : "Birisi";
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,4); }

/* --- İŞLEMLER --- */
function urunEkle() {
  const ad = document.getElementById('yeniUrun').value.trim();
  if(!ad) return;
  veri.liste.push({ id: uid(), ad: ad, alindi: false, ekleyen: userName() });
  document.getElementById('yeniUrun').value = '';
  render(); veriyiGuncelle();
}

function toggleAlindi(id) {
  const item = veri.liste.find(x => x.id === id);
  if(item) { item.alindi = !item.alindi; render(); veriyiGuncelle(); }
}

function urunSil(id) {
  const idx = veri.liste.findIndex(x => x.id === id);
  if(idx > -1) {
    const item = veri.liste.splice(idx, 1)[0];
    item.silinmeTarihi = new Date().toISOString();
    veri.silinenListe.push(item);
    render(); veriyiGuncelle();
  }
}
function urunGeriAl(id) {
  const idx = veri.silinenListe.findIndex(x => x.id === id);
  if(idx > -1) {
    const item = veri.silinenListe.splice(idx, 1)[0];
    item.alindi = false; 
    veri.liste.push(item);
    render(); veriyiGuncelle(); showToast("↩️ Ürün geri alındı");
  }
}
function urunKaliciSil(id) {
  veri.silinenListe = veri.silinenListe.filter(x => x.id !== id);
  render(); veriyiGuncelle(); showToast("🗑 Kalıcı olarak silindi");
}

function harcamaEkle() {
  const ad = document.getElementById('hAd').value.trim();
  const tutar = parseFloat(document.getElementById('hTutar').value);
  if(!ad || !tutar) return showToast("⚠️ Alanları doldurun");
  
  veri.aylar[aktifAy].harcamalar.push({ id: uid(), ad: ad, tutar: tutar, ekleyen: userName(), tarih: new Date().toISOString() });
  
  document.getElementById('hAd').value = '';
  document.getElementById('hTutar').value = '';
  render(); veriyiGuncelle();
}

function harcamaSil(id) {
  const idx = veri.aylar[aktifAy].harcamalar.findIndex(x => x.id === id);
  if(idx > -1) {
    const item = veri.aylar[aktifAy].harcamalar.splice(idx, 1)[0];
    item.silinmeTarihi = new Date().toISOString();
    veri.aylar[aktifAy].silinenHarcamalar.push(item);
    render(); veriyiGuncelle();
  }
}
function harcamaGeriAl(id) {
  const idx = veri.aylar[aktifAy].silinenHarcamalar.findIndex(x => x.id === id);
  if(idx > -1) {
    const item = veri.aylar[aktifAy].silinenHarcamalar.splice(idx, 1)[0];
    veri.aylar[aktifAy].harcamalar.push(item);
    render(); veriyiGuncelle(); showToast("↩️ Harcama geri alındı");
  }
}
function harcamaKaliciSil(id) {
  veri.aylar[aktifAy].silinenHarcamalar = veri.aylar[aktifAy].silinenHarcamalar.filter(x => x.id !== id);
  render(); veriyiGuncelle(); showToast("🗑 Kalıcı olarak silindi");
}

function modalAc(id) {
  document.getElementById(id).classList.add('on');
  document.getElementById('yeniLimit').value = veri.aylar[aktifAy].limit || 0;
}

function limitKaydet() {
  veri.aylar[aktifAy].limit = parseFloat(document.getElementById('yeniLimit').value) || 0;
  document.getElementById('mBakiye').classList.remove('on');
  render(); veriyiGuncelle();
}

function ayDegis(delta) {
  let [y, m] = aktifAy.split('-').map(Number);
  m += delta;
  if (m > 12) { m = 1; y++; }
  if (m < 1) { m = 12; y--; }
  aktifAy = `${y}-${String(m).padStart(2, '0')}`;
  
  if (!veri.aylar[aktifAy]) {
    let prevLimit = 0;
    let keys = Object.keys(veri.aylar).sort();
    if(keys.length > 0) prevLimit = veri.aylar[keys[keys.length-1]].limit;
    veri.aylar[aktifAy] = { limit: prevLimit, harcamalar: [], silinenHarcamalar: [] };
    veriyiGuncelle();
  } else {
    render();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}

/* SWIPE HTML ÜRETİCİ */
function createSwipeItem(id, htmlContent, isAlindi, tip) {
  const solText = isAlindi ? 'Geri Al' : '✓ Alındı';
  const leftAct = tip === 'harcama' ? '' : `<div class="swipe-left">${solText}</div>`;
  
  return `
    <div class="swipe-wrap" id="sw-${id}">
      <div class="swipe-bg" id="sbg-${id}">
        ${leftAct}
        <div class="swipe-right" style="${tip === 'harcama' ? 'width:100%;text-align:right;' : ''}">Sil 🗑</div>
      </div>
      <div class="swipe-content" id="sc-${id}" data-id="${id}" data-tip="${tip}">
        ${htmlContent}
      </div>
    </div>
  `;
}

function buildDeletedHtml(list, tip) {
  if(!list || list.length === 0) return '';
  return `
    <div class="deleted-sec">
      <div class="deleted-head" onclick="this.nextElementSibling.classList.toggle('on')">
        <span>🗑 Son Silinenler (${list.length})</span> <span>Gör ▼</span>
      </div>
      <div class="deleted-body">
        ${list.map(x => `
          <div class="d-item">
            <div class="d-info">
              <div class="d-name">${x.ad} ${tip==='harcama' ? '(₺'+x.tutar+')' : ''}</div>
              <div class="d-meta">${x.ekleyen} · ${new Date(x.silinmeTarihi).toLocaleDateString('tr-TR')}</div>
            </div>
            <div class="d-actions">
              <button class="d-btn" onclick="${tip==='harcama' ? 'harcamaGeriAl' : 'urunGeriAl'}('${x.id}')">Geri Al</button>
              <button class="d-btn red" onclick="${tip==='harcama' ? 'harcamaKaliciSil' : 'urunKaliciSil'}('${x.id}')">Sil</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* RENDER */
function render() {
  if(!veri.aylar) return;

  // MARKET LİSTESİ
  const lKutu = document.getElementById('listeKutusu');
  if(veri.liste.length === 0) {
    lKutu.innerHTML = '<div class="empty"><div style="font-size:40px;margin-bottom:10px">🛒</div>Alınacak bir şey yok.<br>Aşağıdan ekleyebilirsiniz.</div>';
  } else {
    const alinacaklar = veri.liste.filter(x => !x.alindi);
    const alinanlar = veri.liste.filter(x => x.alindi);
    
    let html = '';
    if(alinacaklar.length > 0) {
      html += '<div class="group-lbl">Alınacaklar</div>';
      html += alinacaklar.map(x => createSwipeItem(x.id, `
        <div class="l-info" onclick="toggleAlindi('${x.id}')">
          <div class="chk"></div>
          <div class="l-texts"><div class="l-name">${x.ad}</div><div class="l-meta"><span class="l-who">${x.ekleyen}</span></div></div>
        </div>
      `, false, 'urun')).join('');
    }
    if(alinanlar.length > 0) {
      html += '<div class="group-lbl" style="margin-top:30px">Alınanlar</div>';
      html += alinanlar.map(x => createSwipeItem(x.id, `
        <div class="l-info" onclick="toggleAlindi('${x.id}')">
          <div class="chk on"></div>
          <div class="l-texts"><div class="l-name done">${x.ad}</div><div class="l-meta"><span class="l-who">${x.ekleyen}</span></div></div>
        </div>
      `, true, 'urun')).join('');
    }
    lKutu.innerHTML = html;
  }
  document.getElementById('marketDeletedContainer').innerHTML = buildDeletedHtml(veri.silinenListe, 'urun');

  // BÜTÇE EKRANI
  document.getElementById('ayIsimTxt').textContent = getPeriodName(aktifAy);
  const ayVeri = veri.aylar[aktifAy];
  
  const harcanan = ayVeri.harcamalar.reduce((s, x) => s + x.tutar, 0);
  const kalan = (ayVeri.limit || 0) - harcanan;
  const pct = ayVeri.limit ? Math.min(100, (harcanan / ayVeri.limit) * 100) : 0;

  document.getElementById('bKalan').textContent = `₺${kalan.toLocaleString('tr-TR')}`;
  document.getElementById('bHarcandi').textContent = `₺${harcanan.toLocaleString('tr-TR')} Harcandı`;
  document.getElementById('bLimit').textContent = `Limit: ₺${(ayVeri.limit||0).toLocaleString('tr-TR')}`;
  document.getElementById('bBar').style.width = pct + '%';
  document.getElementById('bBar').style.background = pct > 90 ? 'linear-gradient(90deg, var(--prim), #8b0000)' : '';

  // KİM NE HARCADI
  const kMap = {};
  ayVeri.harcamalar.forEach(x => { kMap[x.ekleyen] = (kMap[x.ekleyen] || 0) + x.tutar; });
  const kisiler = Object.entries(kMap).sort((a,b)=>b[1]-a[1]);
  const kKutu = document.getElementById('kimNeHarcadiKutu');
  if(kisiler.length > 0) {
    kKutu.style.display = 'block';
    document.getElementById('kimNeHarcadi').innerHTML = kisiler.map(([isim, tutar]) => `
      <div class="u-row">
        <div class="u-name"><div class="u-avatar">${isim.charAt(0).toUpperCase()}</div> ${isim}</div>
        <div class="u-amt">₺${tutar.toLocaleString('tr-TR')}</div>
      </div>
    `).join('');
  } else { kKutu.style.display = 'none'; }

  // HARCAMALAR LİSTESİ
  const hKutu = document.getElementById('harcamaKutusu');
  if(ayVeri.harcamalar.length === 0) {
    hKutu.innerHTML = '<div class="empty">Bu periyotta harcama yok.</div>';
  } else {
    const siraliH = [...ayVeri.harcamalar].sort((a,b) => new Date(b.tarih) - new Date(a.tarih));
    hKutu.innerHTML = siraliH.map(x => createSwipeItem(x.id, `
      <div class="l-info">
        <div class="chk on" style="border:none;background:var(--prim-bg);color:var(--prim);font-size:16px;">💸</div>
        <div class="l-texts"><div class="l-name">${x.ad}</div><div class="l-meta"><span class="l-who">${x.ekleyen}</span> · ${new Date(x.tarih).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</div></div>
      </div>
      <div class="h-amt">₺${x.tutar.toLocaleString('tr-TR')}</div>
    `, false, 'harcama')).join('');
  }
  document.getElementById('butceDeletedContainer').innerHTML = buildDeletedHtml(ayVeri.silinenHarcamalar, 'harcama');

  baglaSwipe();
}

/* SWIPE LOGIC */
function baglaSwipe() {
  document.querySelectorAll('.swipe-content').forEach(el => {
    let sx=0, cx=0, swiping=false, moved=false;
    const id = el.dataset.id;
    const tip = el.dataset.tip; 
    const bg = document.getElementById('sbg-'+id);

    el.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX; swiping = true; moved = false; cx = 0;
      el.style.transition = 'none';
      if(bg) bg.style.transition = 'none';
    }, {passive:true});

    el.addEventListener('touchmove', e => {
      if(!swiping) return;
      const dx = e.touches[0].clientX - sx;
      if(!moved && Math.abs(dx) > 10) moved = true;
      if(!moved) return;
      
      if(tip === 'harcama' && dx > 0) return;

      cx = dx;
      if(cx > 100) cx = 100 + (cx-100)*0.2;
      if(cx < -100) cx = -100 + (cx+100)*0.2;
      
      el.style.transform = `translateX(${cx}px)`;
      
      if(bg) {
        bg.style.opacity = Math.min(1, Math.abs(cx)/60);
        if(tip !== 'harcama') bg.querySelector('.swipe-left').style.opacity = cx > 0 ? 1 : 0;
        bg.querySelector('.swipe-right').style.opacity = cx < 0 ? 1 : 0;
      }
    }, {passive:true});

    el.addEventListener('touchend', () => {
      if(!swiping || !moved) return;
      swiping = false;
      el.style.transition = 'transform .25s cubic-bezier(0.2, 0.8, 0.2, 1)';
      if(bg) bg.style.transition = 'opacity .25s';

      if(cx > 70 && tip !== 'harcama') {
        el.style.transform = 'translateX(100%)';
        setTimeout(() => toggleAlindi(id), 250);
        haptic();
      } else if(cx < -70) {
        el.style.transform = 'translateX(-100%)';
        setTimeout(() => tip === 'harcama' ? harcamaSil(id) : urunSil(id), 250);
        haptic();
      } else {
        el.style.transform = 'translateX(0)';
        if(bg) bg.style.opacity = 0;
      }
    });
  });
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate(50);
}

/* SEKMELER & TEMA */
function tab(n) {
  document.querySelectorAll('.page').forEach((e, i) => e.classList.toggle('on', i+1 === n));
  document.querySelectorAll('.nbtn').forEach((e, i) => e.classList.toggle('on', i+1 === n));
  document.getElementById('addBarMarket').style.display = n===1 ? 'flex' : 'none';
  document.getElementById('addBarButce').style.display = n===2 ? 'flex' : 'none';
  window.scrollTo(0,0);
}

function temaDegis(forceDark=false) {
  const isDark = forceDark || document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  document.getElementById('themeColorMeta').content = isDark ? '#000000' : '#f2f2f7';
  localStorage.setItem('evTema', isDark ? 'dark' : 'light');
}
